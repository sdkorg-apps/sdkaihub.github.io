<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="SDK AI Hub apps: Orgora Charts for private org charts, and Roadster Rally in the browser.">
<meta name="apple-itunes-app" content="app-id=6792418699">
<title>SDK AI Hub — software by SDK Equipment LLC</title>
<link rel="icon" href="/assets/sdkaihub_mark.png" type="image/png">
<link rel="apple-touch-icon" href="/assets/sdkaihub_mark.png">
<style>
  :root {
    --ink: #1c1c1e;
    --muted: #5c6560;
    --line: #dce8de;
    --paper: #f4f7f3;
    --card: #ffffff;
    --green: #178a52;
    --mint: #e7f8ee;
    --shadow: 0 12px 40px rgba(28, 44, 32, 0.07);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #e8eee9;
      --muted: #9aa89e;
      --line: #2a3830;
      --paper: #121614;
      --card: #1a1f1c;
      --mint: #1a3a2a;
      --shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background: var(--paper);
    line-height: 1.55;
  }
  a { color: var(--green); text-decoration: none; }
  a:hover { text-decoration: underline; }
  header, main, footer { width: min(1120px, calc(100% - 40px)); margin: 0 auto; }
  header {
    padding: 22px 0 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
  }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: -0.03em; font-size: 1.05rem; color: var(--ink); }
  .brand:hover { text-decoration: none; }
  .brand-mark { width: 22px; height: 22px; display: block; flex: 0 0 auto; }
  nav { display: flex; flex-wrap: wrap; gap: 18px; font-size: 0.92rem; font-weight: 600; align-items: center; }
  nav a { color: var(--ink); }
  nav a.login {
    color: var(--green);
    border: 1px solid var(--green);
    border-radius: 999px;
    padding: 6px 12px;
  }
  nav a.login:hover { text-decoration: none; background: var(--mint); }
  .hero {
    padding: 40px 0 12px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 28px;
  }
  .hero-copy { min-width: 0; }
  h1 { font-size: clamp(2.1rem, 4.4vw, 3.25rem); line-height: 1.06; letter-spacing: -0.045em; margin: 0 0 14px; max-width: 16ch; }
  .lede { max-width: 38rem; color: var(--muted); font-size: 1.12rem; margin: 0; }
  @media (max-width: 800px) {
    .hero { flex-direction: column; align-items: stretch; }
  }
  .apps {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    align-items: stretch;
    padding: 28px 0 48px;
  }
  @media (max-width: 900px) {
    .apps { grid-template-columns: 1fr; }
  }
  .app-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 22px;
    overflow: hidden;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    min-width: 0;
    align-self: stretch;
    transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
  }
  .app-card:hover {
    transform: translateY(-4px);
    border-color: var(--green);
    box-shadow: 0 18px 44px rgba(28, 44, 32, 0.12);
  }
  @media (prefers-color-scheme: dark) {
    .app-card:hover { box-shadow: 0 18px 44px rgba(0, 0, 0, 0.45); }
  }
  .app-card--rally:hover {
    border-color: #e11d48;
    box-shadow: 0 18px 44px rgba(225, 29, 72, 0.22);
  }
  .card-body { padding: 24px 24px 8px; flex: 0 0 auto; }
  .app-pitch { margin: 0 0 14px; }
  .card-media { padding: 8px 24px 24px; }
  .card-media--inline { padding: 0 0 14px; }
  .card-hero {
    display: block;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid var(--line);
    background: #0e1520;
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .card-hero:hover { text-decoration: none; transform: translateY(-2px); }
  .card-hero img {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    background: #0e1520;
  }
  /* Roadster: poster cover-fills remaining card height (no letterbox / empty gap).
     flex-basis:0 + min-height:0 so absolute img can paint the stretched box. */
  .app-card--rally .card-body { padding-bottom: 8px; }
  .app-card--rally .card-media--inline {
    flex: 1 1 0;
    display: flex;
    flex-direction: column;
    /* Keep a 16:9 floor when the card is not stretched (stacked mobile). */
    min-height: 200px;
    margin: 0 14px 14px;
    padding: 0;
  }
  .app-card--rally .card-hero {
    flex: 1 1 0;
    display: block;
    position: relative;
    width: 100%;
    height: 100%;
    min-height: 200px;
    border-radius: 16px;
    overflow: hidden;
    background: #0e1520;
  }
  .app-card--rally .card-hero img {
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    max-width: none;
    max-height: none;
    aspect-ratio: auto;
    object-fit: cover;
    /* Keep baked title (left) + car in frame when cropping tall/wide. */
    object-position: 18% 42%;
    background: #0e1520;
  }
  .app-card--rally .btn.primary {
    background: #e11d48;
    color: #fff;
  }
  .eyebrow { display: flex; gap: 8px; align-items: center; font-size: 0.78rem; font-weight: 650; letter-spacing: 0.04em; text-transform: uppercase; color: var(--green); }
  .live { background: var(--mint); color: var(--green); border-radius: 999px; padding: 3px 8px; }
  h2 { margin: 10px 0 8px; font-size: 1.7rem; letter-spacing: -0.03em; }
  .app-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin: 10px 0 8px;
    flex-wrap: wrap;
  }
  .app-title-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .app-title h2 { margin: 0; }
  .app-title .btn { margin: 0; padding: 8px 14px; font-size: 0.92rem; }
  .open-cta {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
    color: inherit;
  }
  .open-cta:hover { text-decoration: none; }
  .open-note {
    color: var(--muted);
    font-size: 0.78rem;
    font-weight: 600;
    line-height: 1.3;
    text-align: right;
  }
  @media (max-width: 720px) {
    header { flex-wrap: wrap; row-gap: 12px; }
    nav { flex-basis: 100%; margin-left: 0; justify-content: flex-start; row-gap: 8px; }
    .open-cta { align-items: flex-start; }
    .open-note { text-align: left; }
  }
  .app-mark {
    width: 44px; height: 44px; border-radius: 10px; display: block;
    flex: 0 0 auto;
  }
  .orgora-mark { background: var(--mint); }
  .card-body > p { margin: 0 0 14px; }
  .features { display: grid; gap: 10px; margin: 4px 0 6px; }
  .feature {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 12px 14px;
  }
  .feature-brands { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .feature-brands img { width: 28px; height: 28px; display: block; }
  .feature strong { display: block; margin-bottom: 2px; letter-spacing: -0.02em; font-size: 0.95rem; }
  .feature p { margin: 0; color: var(--muted); font-size: 0.9rem; }
  .shots { padding: 8px 24px 24px; display: grid; gap: 12px; }
  .shots img { display: block; width: 100%; height: auto; border-radius: 16px; border: 1px solid var(--line); background: #f3f7f2; }
  .reel { display: grid; gap: 10px; }
  /* All three frames are 16:9. Portrait slides keep the full photo sharp
     in the center and continue that photo, softened, out to the edges. */
  .reel-frame {
    display: grid;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: #141816;
  }
  .shots .reel-frame img {
    grid-area: 1 / 1;
    width: 100%;
    height: auto;
    border: 0;
    border-radius: 0;
    background: transparent;
    opacity: 0;
    pointer-events: none;
    transition: opacity .45s ease;
  }
  .shots .reel-frame img.is-on {
    opacity: 1;
    pointer-events: auto;
  }
  .reel-bar { display: flex; align-items: center; gap: 10px; }
  .reel-caption { flex: 1; margin: 0; color: var(--muted); font-size: 0.95rem; min-height: 1.4em; }
  .reel-nav, .reel-dots button {
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    border-radius: 999px;
    font: inherit;
    font-weight: 650;
    cursor: pointer;
  }
  .reel-nav { width: 36px; height: 36px; flex: 0 0 auto; line-height: 1; }
  .reel-nav:hover, .reel-dots button:hover { border-color: var(--green); }
  .reel-dots { display: flex; gap: 8px; justify-content: center; }
  .reel-dots button { width: 10px; height: 10px; padding: 0; }
  .reel-dots button[aria-current="true"] { background: var(--green); border-color: var(--green); }
  .tour { margin: 4px 0 0; }
  .tour video {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 16px;
    border: 1px solid var(--line);
    background: #111;
  }
  .tour figcaption { margin-top: 8px; color: var(--muted); font-size: 0.92rem; }
  @media (prefers-reduced-motion: reduce) {
    .shots .reel-frame img { transition: none; }
  }
  .feature-shot { padding: 16px; }
  .store-badges img.cws-badge { height: 40px; width: auto; display: block; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
  .btn {
    display: inline-block;
    background: var(--ink);
    color: var(--paper);
    border-radius: 999px;
    padding: 11px 18px;
    font-weight: 650;
  }
  .btn:hover { text-decoration: none; filter: brightness(1.08); }
  .btn.primary { background: var(--green); color: #fff; }
  .store-badges { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 14px; }
  .store-badges a { display: inline-flex; line-height: 0; }
  .store-badges img.app-store-badge { height: 40px; width: auto; display: block; }
  .links { margin: 14px 0 8px; color: var(--muted); font-size: 0.92rem; }
  .muted { color: var(--muted); }
  footer { padding: 8px 0 40px; color: var(--muted); font-size: 0.85rem; }
</style>
</head>
<body>
  <script>
    /* Forward mistaken root OAuth returns to the app. Skip the studio
       homepage when an Orgora web session already exists. Always land on
       /orgora/ (no tip SHA — version.json / stamped assets handle cache). */
    (function () {
      var path = window.location.pathname || "/";
      if (path !== "/" && path !== "") return;
      var home = "/orgora/";
      var hash = window.location.hash || "";
      if (
        hash.indexOf("access_token") !== -1 ||
        hash.indexOf("id_token") !== -1 ||
        hash.indexOf("error=") !== -1
      ) {
        location.replace(home + hash);
        return;
      }
      function orgoraHasCloudSession(key) {
        try {
          var raw = sessionStorage.getItem(key) || localStorage.getItem(key);
          if (!raw) return false;
          var o = JSON.parse(raw);
          return !!(o && o.email && o.token);
        } catch (e) {
          return false;
        }
      }
      if (
        orgoraHasCloudSession("orgora.web.drive.session") ||
        orgoraHasCloudSession("orgora.web.onedrive.session")
      ) {
        location.replace(home);
      }
    })();
  </script>
  <header>
    <a class="brand" href="/">
      <img class="brand-mark" src="/assets/sdkaihub_mark.png" width="22" height="22" alt="">
      SDK AI Hub
    </a>
    <nav aria-label="Site">
      <a href="/orgora-charts/">Support</a>
      <a href="/orgora-charts/privacy.html">Privacy</a>
      <a class="login" href="/orgora/">Open Orgora</a>
    </nav>
  </header>
  <main>
    <section class="hero">
      <div class="hero-copy">
        <h1>Pick an app. Jump in.</h1>
        <p class="lede">Orgora Charts for private org charts. Roadster Rally to play in the browser. More apps can join this hub later.</p>
      </div>
    </section>
    <section class="apps" data-app-hub aria-label="Apps"></section>
    <noscript>
      <section class="apps" aria-label="Apps">
        <article class="app-card">
          <div class="card-body">
            <h2>Orgora Charts</h2>
            <p>Private org charts. Charts stay in your Drive.</p>
            <p><a class="btn primary" href="/orgora/">Open in the browser</a></p>
            <p class="links">
              <a href="https://apps.apple.com/us/app/orgora-charts/id6792418699">App Store</a> ·
              <a href="https://apps.apple.com/us/app/orgora-charts/id6792418699?mt=12">Mac App Store</a> ·
              <a href="https://chromewebstore.google.com/detail/orgora-clipper/knhanhbopbmibdlepnieiindfilicjba">Chrome Web Store</a>
            </p>
          </div>
        </article>
        <article class="app-card app-card--rally">
          <div class="card-body">
            <h2>Roadster Rally</h2>
            <p><a class="btn primary" href="/roadster-rally/play/">Play now</a></p>
          </div>
        </article>
      </section>
    </noscript>
  </main>
  <footer>SDK AI Hub is a brand of SDK Equipment LLC.</footer>
  <script src="/assets/apps.js"></script>
  <script src="/assets/visit.js" defer></script>
</body>
</html>
