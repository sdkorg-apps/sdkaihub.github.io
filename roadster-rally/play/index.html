<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/roadster-rally/play/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Roadster Rally — hop cars, flip over trucks, and dodge traffic.">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Roadster Rally">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Roadster Rally</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0e1520;
      overflow: hidden;
    }
    /* Tap-to-start: Flutter is not loaded until the player taps. */
    #classic-boot {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0e1520;
      color: #f4f0e6;
      font: 700 18px/1.2 "Space Grotesk", "Segoe UI", sans-serif;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #classic-boot span { pointer-events: none; }
    /* Clip crash-shake so the canvas can't flash a dark strip at the edge. */
    flt-glass-pane, flt-scene-host, flutter-view {
      overflow: hidden !important;
    }
  </style>
  <script>
    // Classic-only boot: every visit (including ?map=night) lands in Classic.
    (function () {
      try {
        var u = new URL(location.href);
        u.searchParams.set("map", "classic");
        history.replaceState(null, "", u.pathname + "?" + u.searchParams.toString() + u.hash);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="classic-boot" role="button" tabindex="0" aria-label="Tap to start Roadster Rally">
    <span>TAP TO START</span>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="/assets/visit.js" defer></script>
  <script>
    (function () {
      var started = false;
      function start() {
        if (started) return;
        started = true;
        var el = document.getElementById("classic-boot");
        if (el) el.remove();
        var s = document.createElement("script");
        s.src = "flutter_bootstrap.js";
        s.async = true;
        document.body.appendChild(s);
      }
      var boot = document.getElementById("classic-boot");
      boot.addEventListener("pointerdown", start);
      boot.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          start();
        }
      });
    })();
  </script>
</body>
</html>
