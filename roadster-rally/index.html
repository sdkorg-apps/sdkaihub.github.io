<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Roadster Rally — Classic BETA. Hop cars, flip over trucks, play in the browser.">
<title>Roadster Rally — BETA</title>
<link rel="icon" href="/assets/sdkaihub_mark.png" type="image/png">
<!-- Legacy Night / map-select deep links land on Classic play. -->
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var map = (q.get("map") || "").toLowerCase();
    if (map === "night" || map === "classic") {
      location.replace("/roadster-rally/play/");
    }
  })();
</script>
<style>
  :root {
    --ink: #f8fafc;
    --muted: #94a3b8;
    --line: #2a3648;
    --paper: #0a1018;
    --accent: #e8c547;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    color: var(--ink);
    background:
      radial-gradient(1100px 520px at 70% -8%, rgba(232, 197, 71, 0.16), transparent 55%),
      radial-gradient(800px 480px at 8% 10%, rgba(53, 88, 122, 0.22), transparent 50%),
      var(--paper);
    min-height: 100vh;
    line-height: 1.45;
  }
  a { color: #7de7ff; text-decoration: none; }
  a:hover { text-decoration: underline; }
  header, main, footer { width: min(920px, calc(100% - 36px)); margin: 0 auto; }
  header {
    padding: 22px 0 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
  }
  .brand {
    display: flex; align-items: center; gap: 8px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-weight: 700; letter-spacing: -0.03em; font-size: 1.05rem; color: var(--ink);
  }
  .brand:hover { text-decoration: none; }
  .brand-mark { width: 22px; height: 22px; display: block; }
  nav a {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--muted); font-weight: 600; font-size: 0.92rem;
  }
  .hero {
    position: relative;
    margin: 20px 0 28px;
    min-height: min(72vh, 560px);
    border: 1px solid var(--line);
    overflow: hidden;
    background: #05080e;
  }
  .hero img {
    display: block;
    width: 100%;
    height: min(72vh, 560px);
    object-fit: cover;
  }
  .hero-copy {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 28px 22px 24px;
    background: linear-gradient(transparent, rgba(5, 8, 14, 0.92) 45%);
  }
  .title-row {
    display: flex;
    align-items: baseline;
    gap: 12px;
    flex-wrap: wrap;
  }
  h1 {
    margin: 0;
    font-size: clamp(2.4rem, 6vw, 3.6rem);
    letter-spacing: 0.02em;
    line-height: 0.95;
    font-weight: 700;
  }
  .beta {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    color: var(--accent);
    border: 1px solid rgba(232, 197, 71, 0.85);
    padding: 4px 9px;
    border-radius: 3px;
  }
  .play {
    display: inline-block;
    margin-top: 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    border-radius: 4px;
    padding: 12px 22px;
    font-weight: 700;
    font-size: 0.95rem;
    color: #0e1520;
    background: var(--accent);
  }
  .play:hover { text-decoration: none; filter: brightness(1.06); }
  footer {
    padding: 0 0 36px;
    color: var(--muted);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 0.85rem;
  }
</style>
</head>
<body>
  <header>
    <a class="brand" href="/">
      <img class="brand-mark" src="/assets/sdkaihub_mark.png" width="22" height="22" alt="">
      SDK AI Hub
    </a>
    <nav aria-label="Site">
      <a href="/">Home</a>
    </nav>
  </header>
  <main>
    <a class="hero" href="/roadster-rally/play/" aria-label="Play Roadster Rally">
      <img
        src="/assets/roadster-card-classic.jpg"
        width="1280"
        height="720"
        alt="Roadster Rally Classic. White Roadster mid-flip over a red truck."
      >
      <div class="hero-copy">
        <div class="title-row">
          <h1>Roadster Rally</h1>
          <span class="beta">BETA</span>
        </div>
        <span class="play">Play</span>
      </div>
    </a>
  </main>
  <footer>SDK AI Hub is a brand of SDK Equipment LLC.</footer>
</body>
</html>
