const RANK = { published: 0, derived: 1, estimate: 2, unknown: 3 };

function product(factors) {
  return factors.reduce(function (acc, factor) { return acc * factor.value; }, 1);
}

function roundDollars(n) {
  return Math.round(n);
}

function resolve(slice, year) {
  if (slice.years[year]) return { factors: slice.years[year], flat: false };
  if (year === 2030 && slice.hold && slice.years[2026]) return { factors: slice.years[2026], flat: true };
  return null;
}

function sliceDollars(slice, year) {
  const pack = resolve(slice, year);
  if (!pack) return null;
  return roundDollars(product(pack.factors));
}

function isOpen(slice, on) {
  return slice.gates.every(function (id) { return on.has(id); });
}

function worstKind(factors) {
  return factors.reduce(function (worst, factor) {
    return RANK[factor.kind] > RANK[worst] ? factor.kind : worst;
  }, "published");
}

function totals(on, year) {
  const out = { annualOpen: 0, annualShut: 0, programOpen: 0, programShut: 0, rows: [] };
  LINES.forEach(function (line) {
    if (!line.counted) return;
    line.slices.forEach(function (slice) {
      const usd = sliceDollars(slice, year);
      if (usd == null) return;
      const open = isOpen(slice, on);
      const pool = slice.pool === "program" ? "program" : "annual";
      if (pool === "program") {
        if (open) out.programOpen += usd; else out.programShut += usd;
      } else if (open) out.annualOpen += usd; else out.annualShut += usd;
      out.rows.push({ line: line.id, slice: slice.id, usd: usd, open: open, pool: pool });
    });
  });
  return out;
}

function gateName(id) {
  const gate = GATES.filter(function (item) { return item.id === id; })[0];
  return gate ? gate.name : id;
}

function moneyEffect(id, on, year) {
  const next = new Set(on);
  if (next.has(id)) next.delete(id); else next.add(id);
  const before = totals(on, year);
  const after = totals(next, year);
  return {
    annual: after.annualOpen - before.annualOpen,
    program: after.programOpen - before.programOpen
  };
}

function heldText(id, on, year) {
  let annual = 0;
  let program = 0;
  const names = {};
  LINES.forEach(function (line) {
    if (!line.counted) return;
    line.slices.forEach(function (slice) {
      if (slice.gates.indexOf(id) === -1) return;
      const usd = sliceDollars(slice, year);
      if (usd == null) return;
      const others = slice.gates.filter(function (gateId) { return gateId !== id && !on.has(gateId); });
      if (others.length) {
        if (slice.pool === "program") program += usd; else annual += usd;
        others.forEach(function (gateId) { names[gateId] = true; });
      }
    });
  });
  return { annual: annual, program: program, names: Object.keys(names) };
}

function fmt(n) {
  const value = Math.round(n);
  const sign = value < 0 ? "−" : "";
  const abs = Math.abs(value);
  if (abs >= 1e9) return sign + "$" + trimNum((Math.round(abs / 1e7) / 100).toFixed(2)) + "B";
  if (abs >= 1e6) return sign + "$" + trimNum((abs / 1e6).toFixed(abs / 1e6 >= 100 ? 1 : 2)) + "M";
  return sign + "$" + abs.toLocaleString("en-US");
}

function trimNum(text) {
  return text.replace(/(\.\d*?)0+$/, "$1").replace(/\.$/, "");
}

function fmtFactor(factor) {
  if (factor.unit === "usd") return fmt(factor.value);
  if (factor.unit === "share") return trimNum((factor.value * 100).toFixed(1)) + "%";
  if (factor.unit === "count") {
    if (Number.isInteger(factor.value)) return factor.value.toLocaleString("en-US");
    return trimNum(factor.value.toFixed(2));
  }
  if (factor.unit === "gw") return String(factor.value) + " GW";
  return String(factor.value);
}

function equation(factors) {
  const parts = factors.map(fmtFactor);
  return parts.join(" × ") + " = " + fmt(roundDollars(product(factors)));
}

function readHash() {
  let raw = "";
  try {
    raw = decodeURIComponent(location.hash.replace(/^#/, ""));
  } catch (err) {
    raw = "";
  }
  let year = 2026;
  const on = new Set();
  raw.split("/").filter(Boolean).forEach(function (part) {
    if (part === "2030" || part === "later") year = 2030;
    else if (part === "2026" || part === "selftest") return;
    else part.split(".").forEach(function (id) {
      if (GATES.some(function (gate) { return gate.id === id; })) on.add(id);
    });
  });
  return { year: year, on: on };
}

function writeHash(state) {
  const ids = Array.from(state.on).sort();
  const bits = [];
  if (state.year === 2030) bits.push("2030");
  if (ids.length) bits.push(ids.join("."));
  const target = bits.length ? location.pathname + location.search + "#" + bits.join("/") : location.pathname + location.search;
  if ((location.pathname + location.search + location.hash) !== target) history.replaceState(null, "", target);
}

function boot() {
  const state = readHash();
  const app = document.getElementById("app");

  const coarse = window.matchMedia("(pointer: coarse)").matches;

  function render(focus) {
    const view = totals(state.on, state.year);
    writeHash(state);
    app.replaceChildren(renderPage(view));
    renderSources();
    if (lastOpen != null && view.annualOpen !== lastOpen) {

    if (sheetLine && dialog.open) fillSheet(sheetLine);
    if (focus) {

    }

  }

  function renderPage(view) {
    const annual = view.annualOpen + view.annualShut;
    return el("div", null,
      el("section", { class: "hero" },

        el("h1", null, "SpaceX TAM"),

        el("ul", { class: "rules" },
          el("li", null, "Hover a slice for the multiplication."),

        ),

          el("div", { class: "figure-top" },
            el("div", null,
              el("p", { class: "hero-num", "data-usd": String(view.annualOpen) }, fmt(view.annualOpen)),

            ),

          el("p", { class: "group-deck" }, "Shut is today's state. The link remembers what you open."),

  }

  function masterBar(view) {

      let shut = 0;
      LINES.forEach(function (line) {

          const usd = sliceDollars(slice, state.year);
          if (usd == null) return;

        });

    });

    groups.forEach(function (group) {

  function renderGroup(group) {

      el("p", { class: "group-deck" }, group.deck),

  function renderLine(line) {
    const slices = line.slices.map(function (slice) {
      return { slice: slice, usd: sliceDollars(slice, state.year) };
    }).filter(function (item) { return item.usd != null; });
    const open = slices.reduce(function (sum, item) { return sum + (isOpen(item.slice, state.on) ? item.usd : 0); }, 0);
    const shut = slices.reduce(function (sum, item) { return sum + (isOpen(item.slice, state.on) ? 0 : item.usd); }, 0);
    const total = open + shut;
    const kinds = slices.map(function (item) { return worstKind(resolve(item.slice, state.year).factors); });
    const kind = kinds.length ? kinds.reduce(function (worst, item) { return RANK[item] > RANK[worst] ? item : worst; }, "published") : "unknown";

      "aria-label": line.name + ", " + fmt(open) + " open, " + fmt(shut) + " shut",

    }, slices.map(function (item) {
      const opened = isOpen(item.slice, state.on);
      return el("button", {
        type: "button",

      }, el("span", { class: "seg-label" }, fmt(item.usd)));
    })) : el("div", { class: "bar empty" }, "Not in the total.");
    return el("article", { class: "line", id: "line-" + line.id },
      el("header", null,
        el("h3", null, line.name),
        el("span", { class: "chip " + kind }, kind)
      ),
      el("p", { class: "blurb" }, line.blurb),
      total ? el("p", { class: "money" }, el("strong", null, fmt(open)), " open of " + fmt(total) + (line.slices.some(function (slice) { return slice.pool === "program"; }) ? " · program, not annual" : "")) : el("p", { class: "money" }, el("strong", null, "—")),
      bar,
      later ? el("p", { class: "eq" }, later) : null,
      el("button", { type: "button", class: "math", "data-line": line.id }, "Full breakdown")
    );
  }

  function laterBits(line) {
    if (state.year !== 2026) return "";
    const bits = [];
    line.slices.forEach(function (slice) {
      if (slice.years[2026] || !slice.years[2030]) return;
      bits.push(slice.name + " " + fmt(sliceDollars(slice, 2030)));
    });
    return bits.length ? "On the later lens, not in this total: " + bits.join("; ") + "." : "";
  }

  function renderGate(gate) {
    const on = state.on.has(gate.id);
    const effect = moneyEffect(gate.id, state.on, state.year);
    const held = heldText(gate.id, state.on, state.year);
    let effectLine = "";
    if (effect.annual > 0) effectLine = "Opens " + fmt(effect.annual) + " on this lens";
    else if (effect.annual < 0) effectLine = "Shuts " + fmt(-effect.annual) + " on this lens";
    else if (effect.program > 0) effectLine = "Opens " + fmt(effect.program) + " of program value";
    else if (effect.program < 0) effectLine = "Shuts " + fmt(-effect.program) + " of program value";
    else if (held.annual || held.program) {
      const amount = held.annual || held.program;
      effectLine = "Holds " + fmt(amount) + " until " + held.names.map(gateName).join(" and ") + " is open";
    } else if (state.year === 2026) {
      const later = moneyEffect(gate.id, state.on, 2030);
      const laterHeld = heldText(gate.id, state.on, 2030);
      if (later.annual > 0) effectLine = "No 2026 dollars · later opens " + fmt(later.annual);
      else if (later.annual < 0) effectLine = "No 2026 dollars · later shuts " + fmt(-later.annual);
      else if (laterHeld.annual || laterHeld.program) {
        const laterAmount = laterHeld.annual || laterHeld.program;
        effectLine = "Holds " + fmt(laterAmount) + " on the later lens until " + laterHeld.names.map(gateName).join(" and ") + " is open";
      } else effectLine = "No dollars attached";
    } else effectLine = "No dollars attached";
    if (state.year === 2026 && effect.annual !== 0) {
      const laterMove = moneyEffect(gate.id, state.on, 2030);
      if (laterMove.annual !== effect.annual && laterMove.annual !== 0) {
        effectLine += " · later " + (laterMove.annual > 0 ? "opens " : "shuts ") + fmt(Math.abs(laterMove.annual));
      }
    }
    return el("button", {
      type: "button",
      class: "gate",
      "data-gate": gate.id,
      "aria-pressed": on ? "true" : "false"
    },
      el("span", { class: "gn" }, el("span", null, gate.name), el("span", { class: "pill" }, on ? "Open" : "Shut")),
      el("span", { class: "gs" }, gate.today),
      el("span", { class: "ge" }, effectLine)
    );
  }

  function fillSheet(lineId) {
    const line = LINES.filter(function (item) { return item.id === lineId; })[0];
    if (!line) return;
    const blocks = line.slices.map(function (slice) {
      const pack = resolve(slice, state.year);
      const body = [el("h4", null, slice.name)];
      if (!pack) {
        const later = slice.years[2030] ? fmt(sliceDollars(slice, 2030)) : "not priced";
        body.push(el("p", { class: "note" }, "Not on the " + (state.year === 2030 ? "later" : "2026") + " lens. Later value: " + later + "."));
      } else {
        body.push(el("p", { class: "eq" }, equation(pack.factors) + (pack.flat ? " · repeated, no later source" : "")));
        pack.factors.forEach(function (factor) {
          body.push(el("p", { class: "note" }, el("span", { class: "chip " + factor.kind }, factor.kind), " ", factor.label, " · ", fmtFactor(factor), ". ", factor.note));
        });
        body.push(el("p", { class: "note" }, slice.gates.length ? "Gates: " + slice.gates.map(gateName).join(", ") + ". " + (isOpen(slice, state.on) ? "All open." : "Still shut.") : "No gate. This slice starts open."));
        body.push(el("p", { class: "src note" }, slice.sources));
      }
      slice.gates.forEach(function (id) {
        body.push(el("button", { type: "button", class: "text-btn", "data-gate": id, "data-sheet": "1", style: "margin:6px 8px 0 0" }, (state.on.has(id) ? "Shut " : "Open ") + gateName(id)));
      });
      return el("div", { class: "slice-block" }, body);
    });
    dialog.replaceChildren(el("div", { class: "sheet-body" },
      el("div", { class: "sheet-top" },
        el("h3", null, line.name),
        el("button", { type: "button", class: "text-btn", "data-action": "close" }, "Close")
      ),
      el("p", { class: "blurb" }, line.blurb),
      blocks,
      el("button", { type: "button", class: "text-btn", "data-action": "close", style: "margin-top:12px" }, "Close")
    ));
  }

  function openSheet(lineId) {
    sheetLine = lineId;
    fillSheet(lineId);
    if (!dialog.open) dialog.showModal();
  }

  function showPop(button) {
    if (coarse) return;
    const line = LINES.filter(function (item) { return item.id === button.getAttribute("data-line"); })[0];
    const slice = line && line.slices.filter(function (item) { return item.id === button.getAttribute("data-slice"); })[0];
    if (!slice) return;
    const pack = resolve(slice, state.year);
    if (!pack) return;
    pop.replaceChildren(el("div", null,
      el("strong", null, line.name + " — " + slice.name),
      el("p", { class: "eqline" }, equation(pack.factors)),
      pack.factors.map(function (factor) {
        return el("p", null, factor.label + " (" + factor.kind + "): " + factor.note);
      }),
      el("p", null, slice.gates.length ? "Moves when " + slice.gates.map(gateName).join(" and ") + (slice.gates.length > 1 ? " are" : " is") + " open." : "No gate on this slice."),
      el("p", { class: "src" }, slice.sources)
    ));
    pop.hidden = false;
    if (!coarse && window.innerWidth > 900) {
      const rect = button.getBoundingClientRect();
      const width = pop.offsetWidth;
      let left = rect.left;
      if (left + width > window.innerWidth - 12) left = window.innerWidth - width - 12;
      pop.style.left = Math.max(12, left) + "px";
      pop.style.top = Math.min(window.innerHeight - pop.offsetHeight - 12, rect.bottom + 8) + "px";
    }
  }

  document.addEventListener("click", function (event) {
    const gate = event.target.closest("[data-gate]");
    if (gate) {
      const id = gate.getAttribute("data-gate");
      if (state.on.has(id)) state.on.delete(id); else state.on.add(id);
      announce(id);
      render({ id: id, sheet: gate.hasAttribute("data-sheet") || event.target.closest("dialog") });
      return;
    }
    const year = event.target.closest("[data-year]");
    if (year) {
      state.year = Number(year.getAttribute("data-year"));
      announceYear();
      render();
      return;
    }
    const action = event.target.closest("[data-action]");
    if (action) {
      const name = action.getAttribute("data-action");
      if (name === "today") { state.on.clear(); state.year = 2026; }
      if (name === "all") GATES.forEach(function (gate) { state.on.add(gate.id); });
      if (name === "copy") { copyLink(); return; }
      if (name === "close") { dialog.close(); sheetLine = null; return; }
      render();
      return;
    }
    const lineButton = event.target.closest("[data-line]");
    if (lineButton) openSheet(lineButton.getAttribute("data-line"));
  });

  document.addEventListener("pointerover", function (event) {
    const slice = event.target.closest("[data-slice]");

  });
  document.addEventListener("focusin", function (event) {
    const slice = event.target.closest("[data-slice]");
    if (slice) showPop(slice);
  });
  document.addEventListener("pointerout", function (event) {
    const slice = event.target.closest("[data-slice]");
    if (!slice || slice.contains(event.relatedTarget)) return;
    pop.hidden = true;
  });
  document.addEventListener("focusout", function (event) {
    const slice = event.target.closest("[data-slice]");
    if (!slice) return;
    pop.hidden = true;
  });

  function announce(id) {
    const view = totals(state.on, state.year);
    const open = state.on.has(id);
    live.textContent = gateName(id) + (open ? " is open. " : " is shut. ") + fmt(view.annualOpen) + " open on this lens.";
  }

  function announceYear() {
    const view = totals(state.on, state.year);
    live.textContent = (state.year === 2030 ? "Later lens. " : "2026 lens. ") + fmt(view.annualOpen) + " open.";
  }

  function copyLink() {
    const text = location.href;
    function showField() {
      const box = app.querySelector(".linkbox");
      live.textContent = "Select the link and copy it.";
      if (box) { box.focus(); box.select(); }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        live.textContent = "Link copied.";

    } else showField();

  function renderSources() {
    const foot = document.getElementById("sources");
    foot.replaceChildren(
      el("h2", null, "How to read the sum"),
      el("p", null, "The lines overlap. Starshield is not inside the Starlink bars, even where an analyst folded it into a $20 billion Starlink year. Falcon and Starship both touch launch. Dragon's crew price includes a launch. Terafab, orbital compute, and the Grok API all touch AI spending. X Premium, Grok Chat, and Grok Bot can be the same person paying once. The headline adds the hypotheses anyway. It is not a market, and it is not a forecast of SpaceX revenue."),

      )
    );
  }

  function item(text) { return el("li", null, text); }

  dialog.addEventListener("close", function () { sheetLine = null; });
  render();
}

function audit() {
  function assert(cond, msg) {
    if (!cond) throw new Error(msg);
  }
  const none = totals(new Set(), 2026);
  const all = totals(new Set(GATES.map(function (gate) { return gate.id; })), 2026);
  const fabOnly = totals(new Set(["fab"]), 2026);
  const both = totals(new Set(["fab", "node"]), 2026);
  const laterShut = totals(new Set(), 2030);
  const shipOnly = totals(new Set(["ship"]), 2030);
  const orb = totals(new Set(["orb", "ship"]), 2030);
  assert(none.annualOpen + none.annualShut === all.annualOpen + all.annualShut, "gate toggle leaked dollars");
  assert(fabOnly.annualOpen === none.annualOpen, "factory gate alone moved Terafab");
  assert(Math.round(both.annualOpen - none.annualOpen) === Math.round(193.7e9 * 0.1), "Terafab capture");
  assert(none.programOpen === 0 && none.programShut === 2.9e9, "HLS program pool");
  assert(moneyEffect("hls", new Set(), 2026).annual === 0, "HLS touched the annual sum");
  assert(moneyEffect("hls", new Set(), 2026).program === 2.9e9, "HLS program effect");
  assert(moneyEffect("lic-rest", new Set(), 2026).annual === 6.3e9, "landing rights");
  assert(shipOnly.annualOpen > laterShut.annualOpen, "Starship later");
  assert(orb.annualOpen > shipOnly.annualOpen, "orbital needs both gates");
  assert(fmt(1015000000) === "$1.02B", "billion half-up");
  assert(fmt(185.45e9) === "$185.45B", "genai billions");
  assert(fmt(193.7e9) === "$193.7B", "nvidia billions");
  assert(fmt(21e9) === "$21B", "whole billions");
  assert(fmt(19.37e9) === "$19.37B", "terafab billions");
  const fabOn = new Set(["fab"]);
  const heldFab = heldText("fab", fabOn, 2026);
  assert(heldFab.names.indexOf("node") !== -1 && heldFab.annual === Math.round(193.7e9 * 0.1), "open factory still holds Terafab");
  assert(moneyEffect("own-net", new Set(["own-net"]), 2030).annual < 0, "own network later shuts when open");
  LINES.forEach(function (line) {
    line.slices.forEach(function (slice) {
      if (slice.gates.indexOf("avi-fleet") === -1) return;
      assert(fmt(sliceDollars(slice, 2026)) === "$1.02B", "aviation shut display");
    });
  });
  LINES.forEach(function (line) {
    line.slices.forEach(function (slice) {
      [2026, 2030].forEach(function (year) {
        const usd = sliceDollars(slice, year);
        if (usd == null) return;
        assert(isFinite(usd) && usd > 0, line.id + " " + slice.id + " " + year);
      });
    });
  });
  return {
    open: fmt(none.annualOpen),
    shut: fmt(none.annualShut),
    terafab: fmt(both.annualOpen - none.annualOpen),
    program: fmt(none.programShut),
    orbital: fmt(orb.annualOpen - shipOnly.annualOpen),
    laterOpen: fmt(laterShut.annualOpen)
  };
}

function el(tag, attrs) {
  const node = document.createElement(tag);
  const kids = Array.prototype.slice.call(arguments, 2).flat();
  if (attrs) {
    Object.keys(attrs).forEach(function (key) {
      const value = attrs[key];
      if (value == null || value === false) return;
      if (key === "class") node.className = value;
      else node.setAttribute(key, String(value));
    });
  }
  kids.forEach(function (kid) {
    if (kid == null || kid === false) return;
    node.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  });
  return node;
}

if (typeof document !== "undefined") boot();
else print(JSON.stringify(audit()));
</script>
