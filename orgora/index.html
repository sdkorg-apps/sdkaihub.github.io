<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/orgora/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Open your Orgora chart from your own Google Drive.">
  <!-- Do not set google-signin-client_id. Chrome FedCM treats that meta as
       a license to show One Tap ("Sign in to Orgora Charts with Google")
       after implicit OAuth already signed the user in. Drive SSO uses
       accounts.google.com/o/oauth2/v2/auth, not GIS One Tap. -->

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Orgora Charts">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Orgora Charts</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js?v=e7b11ff" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    (function () {
      // Boot-time OAuth redirect_uri (before Flutter can leave path as "/").
      var origin = window.location.origin;
      var path = "/";
      var baseEl = document.querySelector("base");
      var href = baseEl && baseEl.getAttribute("href");
      var unreplacedBase = "$" + "FLUTTER_BASE_HREF";
      if (href && href !== unreplacedBase) {
        if (href.indexOf("http://") === 0 || href.indexOf("https://") === 0) {
          try {
            path = new URL(href).pathname || "/";
          } catch (e) {
            path = window.location.pathname || "/";
          }
        } else {
          path = href.charAt(0) === "/" ? href : "/" + href;
        }
      } else {
        path = window.location.pathname || "/";
      }
      if (!path) path = "/";
      if (path.charAt(path.length - 1) !== "/") path = path + "/";
      window.__ORGORA_OAUTH_REDIRECT__ = origin + path;

      var hash = window.location.hash || "";
      var search = window.location.search || "";
      var provider = sessionStorage.getItem("orgora.web.oauth.provider") || "";
      var grantPayload = "";
      if (
        hash.indexOf("access_token=") !== -1 ||
        hash.indexOf("id_token=") !== -1 ||
        hash.indexOf("error=") !== -1
      ) {
        grantPayload = hash;
      } else if (
        search.indexOf("code=") !== -1 ||
        search.indexOf("error=") !== -1
      ) {
        grantPayload = search;
      }
      if (grantPayload) {
        if (provider === "microsoft") {
          sessionStorage.setItem("orgora.web.onedrive.grant", grantPayload);
        } else {
          sessionStorage.setItem("orgora.web.drive.grant", grantPayload);
        }
        sessionStorage.removeItem("orgora.web.oauth.provider");
        if (window.history && window.history.replaceState) {
          history.replaceState(null, "", window.location.pathname);
        }
      }
      // Chrome Clipper: stash #orgora_clip= before Flutter's hash URL
      // strategy or the SSO gate can drop it.
      var clipHash = window.location.hash || "";
      if (clipHash.indexOf("orgora_clip=") !== -1) {
        try {
          sessionStorage.setItem(
            "orgora.web.clip.pending",
            clipHash.charAt(0) === "#" ? clipHash.substring(1) : clipHash
          );
        } catch (e) {}
        if (window.history && window.history.replaceState) {
          history.replaceState(
            null,
            "",
            window.location.pathname + (window.location.search || "")
          );
        }
      }
    })();
  </script>
  <script src="flutter_bootstrap.js?v=e7b11ff" async></script>
</body>
</html>
