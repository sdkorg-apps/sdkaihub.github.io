<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="SpaceX total addressable market. The May 2026 S-1 prints $28.5 trillion. Sourced lines are open. The rest of each print stays shut until its gate is opened.">
<title>SpaceX TAM</title>
<link rel="icon" href="/assets/sdkaihub_mark.png" type="image/png">
<style>
  :root {
    --ink: #1c1914;
    --muted: #5e574c;
    --faint: #8a8172;
    --line: #e3d8c4;
    --paper: #f4efe4;
    --card: #fffdf8;
    --open: #0e7a43;
    --open-ink: #f4fff8;
    --shut: #a61d2e;
    --shut-ink: #fff8f8;
    --copper: #8a4e1c;
    --shadow: 0 16px 40px rgba(60, 40, 10, 0.08);
    --serif: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; color-scheme: light; }
  body {
    margin: 0;
    color: var(--ink);
    background:
      radial-gradient(1200px 500px at 10% -10%, rgba(138, 78, 28, 0.08), transparent 50%),
      var(--paper);
    font-family: var(--sans);
    line-height: 1.45;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0 auto 0 0;
    width: 8px;
    background: #1c1914;
    z-index: 5;
  }
  a { color: var(--copper); }
  button, input { font: inherit; color: inherit; }
  .wrap { width: min(980px, calc(100vw - 48px)); margin: 0 auto; }
  header.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
    padding: 22px 0 8px;
  }
  .brand { display: flex; align-items: center; gap: 8px; color: var(--ink); text-decoration: none; font-weight: 700; }
  .brand img { width: 22px; height: 22px; }
  .tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .tools a { color: var(--ink); text-decoration: none; font-weight: 700; font-size: 0.92rem; }
  a.donate,
  .tools a.donate {
    display: inline-block;
    background: var(--card);
    color: var(--ink);
    border: 2px solid var(--ink);
    text-decoration: none;
    border-radius: 999px;
    padding: 8px 14px;
    font-weight: 700;
    font-size: 0.9rem;
  }
  a.donate:hover,
  .tools a.donate:hover { background: var(--ink); color: var(--paper); }
  .hero { padding: 12px 0 8px; }
  .kicker {
    margin: 0 0 8px;
    color: var(--copper);
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  h1 {
    margin: 0;
    font-family: var(--serif);
    font-size: clamp(2.6rem, 6vw, 4.6rem);
    font-weight: 600;
    letter-spacing: -0.03em;
    line-height: 0.95;
  }
  .lede { max-width: 62ch; color: var(--muted); font-size: 1.02rem; margin: 12px 0 0; }
  .rules { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 0; padding: 0; list-style: none; }
  .rules li {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 0.86rem;
  }
  .figure {
    margin-top: 22px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: var(--shadow);
    padding: 22px 22px 16px;
  }
  .figure-top { display: flex; justify-content: space-between; gap: 18px; align-items: flex-end; flex-wrap: wrap; }
  .hero-num {
    margin: 0;
    font-family: var(--serif);
    font-size: clamp(3.2rem, 8vw, 5.4rem);
    font-weight: 600;
    letter-spacing: -0.04em;
    line-height: 0.9;
    font-variant-numeric: tabular-nums;
  }
  .hero-num.moved { animation: ink 0.6s ease; }
  @keyframes ink { from { color: var(--copper); } to { color: var(--ink); } }
  .hero-sub { margin: 8px 0 0; color: var(--muted); font-family: var(--mono); font-size: 0.92rem; display: flex; flex-wrap: wrap; gap: 4px 14px; }
  .hero-sub strong { color: var(--shut); font-weight: 650; white-space: nowrap; }
  .hero-sub .open { color: var(--open); font-weight: 650; white-space: nowrap; }
  .scale { margin: 8px 0 0; color: var(--faint); font-size: 0.88rem; max-width: 68ch; }
  .year {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    max-width: 100%;
    background: var(--paper);
    border-radius: 18px;
    padding: 4px;
    border: 1px solid var(--line);
    gap: 4px;
  }
  .year button, .text-btn, .gate, .seg, .math, .chunk, .key button { cursor: pointer; }
  .year button {
    border: 0;
    background: transparent;
    border-radius: 999px;
    padding: 8px 12px;
    font-weight: 650;
  }
  .year button[aria-pressed="true"] { background: #1c1914; color: #f4efe4; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 14px; }
  .text-btn {
    border: 1px solid var(--line);
    background: var(--card);
    border-radius: 999px;
    padding: 8px 12px;
    font-weight: 650;
  }
  .text-btn:hover, .math:hover, .gate:hover, .chunk:hover, .key button:hover { border-color: #1c1914; }
  .linkbox {
    flex: 1 1 220px;
    min-width: 0;
    border: 1px solid var(--line);
    background: var(--paper);
    border-radius: 999px;
    padding: 8px 12px;
    font-family: var(--mono);
    font-size: 12px;
  }
  .master { margin-top: 18px; }
  .master-bar {
    display: flex;
    height: 28px;
    width: 100%;
    border-radius: 8px;
    overflow: hidden;
    background: #efe6d4;
    gap: 3px;
  }
  .chunk {
    display: flex;
    min-width: 8px;
    overflow: hidden;
    border-radius: 4px;
    border: 0;
    padding: 0;
    background: transparent;
  }
  .chunk.open { background: var(--open); }
  .chunk.shut {
    background-color: var(--shut);
    background-image: repeating-linear-gradient(-45deg, rgba(255,255,255,.22) 0 5px, transparent 5px 10px);
  }
  .chunk.lit { outline: 2px solid var(--ink); outline-offset: -2px; }
  .board { margin-top: 14px; border-top: 1px solid var(--line); }
  .ev { border-bottom: 1px solid var(--line); }
  .ev button {
    display: grid;
    grid-template-columns: 10px minmax(0, 1.1fr) minmax(0, 1.4fr) auto;
    gap: 10px;
    align-items: center;
    width: 100%;
    text-align: left;
    border: 0;
    background: transparent;
    padding: 8px 0;
    cursor: pointer;
  }
  .ev i { width: 10px; height: 10px; border-radius: 2px; }
  .ev.open i { background: var(--open); }
  .ev.shut i { background: var(--shut); }
  .ev b { font-weight: 650; }
  .ev .money, .ev .eq { font-family: var(--mono); font-size: 12px; }
  .ev .eq { color: var(--muted); }
  .ev .money { color: var(--ink); white-space: nowrap; }
  .pts { display: none; padding: 0 0 10px 20px; }
  .ev.on .pts { display: block; }
  .card .pts { display: block; margin-top: 8px; padding: 0; }
  .pt { display: grid; grid-template-columns: 6.2rem minmax(0, 1fr); gap: 8px; margin: 4px 0; font-size: 0.86rem; }
  .pt b { font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--copper); font-weight: 650; padding-top: 3px; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 8px 0 28px; }
  .card {
    text-align: left;
    border: 1px solid var(--line);
    background: var(--card);
    border-radius: 14px;
    padding: 12px 14px;
    border-left: 4px solid var(--ink);
  }
  .card.hypothesis { border-left-color: var(--copper); }
  .card header { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .card h3 { margin: 0; font-size: 1rem; }
  .card .eq { margin: 6px 0; }
  .card p { margin: 0; color: var(--muted); font-size: 0.88rem; }
  .chip.hypothesis { background: #f8efe4; color: #6a3d12; }
  .key { display: flex; flex-wrap: wrap; gap: 8px 10px; margin: 10px 0 0; padding: 0; list-style: none; }
  .key button {
    font-size: 0.82rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    background: var(--paper);
    border: 0;
    border-radius: 999px;
    padding: 4px 8px;
  }
  .key b { color: var(--ink); font-weight: 650; }
  .lines { padding: 8px 0 12px; }
  .group { scroll-margin-top: 16px; }
  .group h2, .bare-wrap h2, #grok h2 { font-size: 0.78rem; letter-spacing: 0.14em; text-transform: uppercase; margin: 22px 0 8px; }
  .group-deck { margin: -4px 0 10px; color: var(--muted); font-size: 0.92rem; }
  .line {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 14px 14px 12px;
    margin: 0 0 10px;
    scroll-margin-top: 16px;
  }
  .line header { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .line h3 { margin: 0; font-size: 1.05rem; letter-spacing: -0.02em; }
  .blurb { margin: 6px 0 0; color: var(--muted); font-size: 0.9rem; }
  .money { margin: 10px 0 8px; font-variant-numeric: tabular-nums; }
  .money strong { font-family: var(--serif); font-size: 1.55rem; font-weight: 600; letter-spacing: -0.03em; }
  .bar {
    display: grid;
    height: 36px;
    width: 100%;
    border-radius: 8px;
    overflow: hidden;
    background: #efe6d4;
    gap: 3px;
  }
  .bar.empty {
    display: flex;
    align-items: center;
    padding: 0 12px;
    color: var(--faint);
    font-size: 0.85rem;
    border: 1px dashed var(--line);
    background: transparent;
  }
  .seg {
    position: relative;
    border: 0;
    min-width: 0;
    padding: 0;
    text-align: left;
    height: 100%;
  }
  .seg.open { background: var(--open); color: var(--open-ink); }
  .seg.shut {
    color: var(--shut-ink);
    background-color: var(--shut);
    background-image: repeating-linear-gradient(-45deg, rgba(255,255,255,.2) 0 6px, transparent 6px 12px);
  }
  .seg.lit { box-shadow: inset 0 0 0 3px #f4efe4, inset 0 0 0 6px #1c1914; }
  .seg-label {
    display: block;
    padding: 0 8px;
    line-height: 36px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-family: var(--mono);
    font-size: 12px;
  }
  .eq { margin: 8px 0 0; color: var(--ink); font-family: var(--mono); font-size: 12px; }
  .math {
    margin-top: 8px;
    border: 0;
    background: transparent;
    padding: 0;
    color: var(--copper);
    font-weight: 700;
    font-size: 0.86rem;
  }
  .line-gates { margin-top: 8px; }
  .chip {
    flex: 0 0 auto;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border-radius: 999px;
    padding: 3px 7px;
  }
  .chip.published { background: #e5f4eb; color: #1d4e36; }
  .chip.derived { background: #e7eef8; color: #1e3a5f; }
  .chip.estimate { background: #f8efd8; color: #6a4a12; }
  .chip.unknown { background: #ece7df; color: #3d3a36; }
  .gate {
    display: flex;
    width: 100%;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    text-align: left;
    border: 1px solid var(--line);
    background: var(--card);
    border-radius: 12px;
    padding: 8px 12px;
    border-left: 4px solid var(--shut);
  }
  .gate[aria-pressed="true"] { border-left-color: var(--open); background: #f3fbf6; }
  .gate .gn { display: flex; align-items: center; gap: 8px; font-weight: 700; }
  .gate .ge { font-family: var(--mono); font-size: 12px; color: var(--copper); white-space: nowrap; }
  .pill { font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; }
  .gate[aria-pressed="true"] .pill { color: var(--open); }
  .gate[aria-pressed="false"] .pill { color: var(--shut); }
  .bare { list-style: none; padding: 0; margin: 0 0 28px; }
  .bare li {
    display: grid;
    grid-template-columns: 9.5rem minmax(0, 1fr);
    gap: 8px 14px;
    padding: 8px 0;
    border-top: 1px solid var(--line);
    font-size: 0.92rem;
  }
  .bare b { font-weight: 650; }
  .pop {
    position: fixed;
    z-index: 30;
    width: min(460px, calc(100vw - 24px));
    max-height: min(70vh, 420px);
    overflow: auto;
    background: #1c1914;
    color: #f6f1e6;
    border-radius: 14px;
    padding: 12px 14px;
    box-shadow: var(--shadow);
    pointer-events: none;
  }
  .pop.pin { pointer-events: auto; }
  .pop[hidden] { display: none; }
  .pop .eqline { font-family: var(--mono); font-size: 12px; color: #f0d7b4; margin: 6px 0; }
  .pop p { margin: 6px 0; font-size: 0.84rem; color: #e6dfd2; }
  .pop .src { color: #b7ad9e; font-size: 0.78rem; }
  dialog {
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 0;
    width: min(680px, calc(100vw - 24px));
    background: var(--card);
    color: var(--ink);
  }
  dialog::backdrop { background: rgba(28, 25, 20, 0.45); }
  .sheet-body { padding: 18px 18px 22px; max-height: min(78vh, 820px); overflow: auto; }
  .sheet-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .sheet-body h3 { font-family: var(--serif); font-size: 1.8rem; margin: 0; }
  .slice-block { border-top: 1px solid var(--line); padding: 12px 0; }
  .slice-block h4 { margin: 0 0 6px; }
  .note { margin: 4px 0; color: var(--muted); font-size: 0.9rem; }
  footer.colophon { padding: 0 0 40px; color: var(--muted); font-size: 0.86rem; }
  footer.colophon h2 { font-size: 0.95rem; color: var(--ink); }
  footer.colophon li { margin: 4px 0; }
  .sr {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    border: 0;
  }
  :focus-visible { outline: 2px solid var(--copper); outline-offset: 2px; }
  @media (max-width: 700px) {
    body::before { width: 0; }
    .wrap { width: min(980px, calc(100vw - 28px)); }
    header.top { display: block; }
    .tools { margin-top: 12px; }
    .year { justify-content: flex-start; }
    .bare li { grid-template-columns: 1fr; gap: 2px; }
    .cards { grid-template-columns: 1fr; }
    .ev button { grid-template-columns: 10px minmax(0, 1fr) auto; }
    .ev .eq { display: none; }
    .ev.on .eq { display: block; grid-column: 2 / -1; grid-row: 2; }
    .gate { flex-wrap: wrap; }
    .pop { left: 12px !important; right: 12px; top: auto !important; bottom: 12px; width: auto; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  }
</style>
</head>

<div class="wrap">
  <header class="top">
    <a class="brand" href="/tam/"><img src="/assets/sdkaihub_mark.png" alt="">TAM</a>
    <nav class="tools">
      <a href="/tam/">All companies</a>
      <a class="donate" href="https://x.com/messages/compose?recipient_id=2426099365&amp;text=Donation%20for%20the%20TAM%20boards" target="_blank" rel="noopener">Donate to @GenAIBiz</a>

  </header>
  <p id="live" class="sr" aria-live="polite"></p>

</div>
<script>
const WHEN = "9 October 2026";
const PONDS = 370e9 + 870e9 + 740e9 + 2.4e12 + 760e9 + 600e9 + 22.7e12;
const S1 = "SpaceX preliminary S-1, 20 May 2026, as quoted by The Wall Street Journal.";
const QUILTY = "Quilty Space, Starlink Financial Overview, 20 March 2026.";

const GATES = [
  { id: "s1-space", name: "Rest of space" },
  { id: "s1-bb", name: "Rest of broadband" },
  { id: "s1-mobile", name: "Mobile print" },
  { id: "s1-infra", name: "Rest of AI infrastructure" },
  { id: "s1-subs", name: "Rest of subscriptions" },
  { id: "s1-ads", name: "Rest of advertising" },
  { id: "s1-apps", name: "Rest of enterprise applications" }
];

const GROUPS = [
  { id: "filing", name: "Filing", deck: "Printed S-1 parts. The gate opens the red segment on that line." },
  { id: "starlink", name: "Starlink", deck: "Quilty's 2026 forecasts. No invented share." },
  { id: "gov", name: "Gov", deck: "One Starshield forecast. No agency split." },
  { id: "x", name: "X", deck: "2025 advertising from filing coverage." }
];

const GROK_N = 1.9e6;
const GROK_PRICE = 30;
const GROK_CHECK = GROK_N * GROK_PRICE * 12;
const STARLINK_N = 10.3e6;
const STARLINK_ARPU = 66;
const STARLINK_CHECK = STARLINK_N * STARLINK_ARPU * 12;
const HR = "Hollywood Reporter, 26 May 2026, on the filing.";
const IBD = "Investor's Business Daily, 21 May 2026, on the filing.";
const METHOD = "SpaceX preliminary S-1 risk factors, as quoted by Cape Fear Advisors, 22 May 2026.";
const PRICE = "x.ai/pricing, checked 9 October 2026.";

const GROK = [
  {
    id: "chat",
    name: "Chat",
    kind: "hypothesis",
    eq: "1.9 million × $30 × 12",
    deck: "If every subscriber in the filing count paid the SuperGrok list price. The mix is not printed. Not in the $28.44T.",
    points: [
      ["published", "About 1.9 million paid subscribers across SuperGrok, SuperGrok Heavy, and SuperGrok Lite. With about 4.4 million X Premium and Premium+, paid subscribers are about 6.3 million. " + HR],
      ["published", "SuperGrok is $30 a month and includes Grok Bot. SuperGrok Plus is $100 a month and raises usage on Chat, Imagine, Voice, and Build. Lite and Heavy are listed with no public price. " + PRICE],
      ["published", "Imagine produced about 10 billion images and over 2 billion videos a month in the first quarter of 2026. No price per image or video. " + HR],
      ["hypothesis", "The check uses the middle list price on the whole count. It is not revenue, and it is not subtracted from the $760B consumer pond."]
    ]
  },
  {
    id: "bot",
    name: "Bot",
    kind: "unknown",
    eq: "No separate price",
    deck: "Grok Bot is included with SuperGrok. No separate count is in the filing, so there is no dollar.",
    points: [
      ["published", "The public plan table includes Grok Bot on SuperGrok. " + PRICE],
      ["unknown", "No standalone fee and no Bot-only subscriber count. A dollar here would be invented."]
    ]
  },
  {
    id: "build",
    name: "Build",
    kind: "unknown",
    eq: "No published volume",
    deck: "Build is on the plan table. Plus raises its usage. No seat count and no token volume, so there is no dollar.",
    points: [
      ["published", "Grok Build is a row on the plan table. SuperGrok Plus is the tier that states higher Build usage. " + PRICE],
      ["unknown", "The $2.40T infrastructure print is the compute market. It is not Build revenue."]
    ]
  },
  {
    id: "api",
    name: "API",
    kind: "unknown",
    eq: "No published volume",
    deck: "The API is metered separately from the subscriptions. Usage is not published, so there is no dollar.",
    points: [
      ["published", "The pricing page has an API tab beside the subscriptions. " + PRICE],
      ["unknown", "No call volume and no API revenue in the sources used here. Token rates without volume are not a market."]
    ]
  }
];

const UNPRICED = [
  {
    name: "X Premium",
    text: "About 4.4 million Premium and Premium+ subscribers. " + HR + " Revenue for that count is not printed. A list-price multiplication would overlap Grok access, so it is not made."
  },
  {
    name: "X Money",
    text: "No published account count or fee. Outside this sum."
  },
  {
    name: "Aviation",
    text: "Quilty: up 68% in 2026. The product page prints no dollar. A conflicting dollar in other coverage is not booked."
  },
  {
    name: "Direct to cell",
    text: "Quilty: 25 million monthly users by the end of 2026. No price is printed, so nothing is subtracted from the $740B mobile print."
  },
  {
    name: "IoT",
    text: "No published device count and no published fee."
  },
  {
    name: "Launch",
    text: "Flight 14 on 28 September 2026 reached orbit and deployed 26 Starlink V3 satellites. No price is published. The $370B print is the market, not this flight."
  },
  {
    name: "Point to point",
    text: "The Motley Fool, 2 October 2026: the printed TAM does not include Earth-to-Earth transport. No fare is published."
  },
  {
    name: "Orbital compute",
    text: "The Motley Fool, 2 October 2026: the printed TAM does not include data centers in space. No dollar is published."
  },
  {
    name: "Terafab",
    text: "No published dollar. Not a share of another company's sales, and not subtracted from the $2.40T infrastructure print."
  }
];

function F(label, value, unit, kind, note) {
  return { label: label, value: value, unit: unit, kind: kind, note: note };
}

function pond(id, name, blurb, value, lines, note, points) {
  return {
    id: id,
    group: "filing",
    name: name,
    blurb: blurb,
    counted: true,
    slices: [{
      id: id + "-rest",
      name: name,
      gates: [id],
      remainder: { pond: value, lines: lines, note: note },
      sources: S1,
      points: points
    }]
  };
}

function sourced(id, group, name, blurb, amount, label, kind, note, sources, asOf, points) {
  return {
    id: id,
    group: group,
    name: name,
    blurb: blurb,
    counted: true,
    slices: [{
      id: id + "-fig",
      name: name,
      gates: [],
      hold: true,

const RANK = { published: 0, derived: 1, estimate: 2, unknown: 3 };

function product(factors) {
  return factors.reduce(function (acc, factor) { return acc * factor.value; }, 1);
}

function roundDollars(n) {
  return Math.round(n);
}

function lineById(id) {
  return LINES.filter(function (item) { return item.id === id; })[0];
}

function usedByRemainder(slice, year) {
  let used = 0;
  slice.remainder.lines.forEach(function (id) {
    const line = lineById(id);
    if (!line || !line.counted) return;
    line.slices.forEach(function (part) {
      if (part.pool === "program" || part.remainder) return;
      const usd = sliceDollars(part, year);
      if (usd != null) used += usd;
    });
  });
  return used;
}

function resolve(slice, year) {
  if (slice.remainder) {
    return {
      factors: [F("Issuer pond", slice.remainder.pond, "usd", "published", slice.remainder.note)],
      flat: year !== 2026,
      asOf: 2026
    };
  }
  if (slice.years[year]) return { factors: slice.years[year], flat: false, asOf: slice.asOf || year };
  if (slice.hold && slice.years[2026] && year > 2026 && year <= 2030) {
    return { factors: slice.years[2026], flat: true, asOf: slice.asOf || 2026 };
  }
  return null;
}

function sliceDollars(slice, year) {
  if (slice.remainder) {
    const rest = slice.remainder.pond - usedByRemainder(slice, year);
    if (!(rest > 0)) return null;
    return Math.round(rest);
  }
  const pack = resolve(slice, year);
  if (!pack) return null;
  return roundDollars(product(pack.factors));
}

function isOpen(slice, on) {
  return slice.gates.every(function (id) { return on.has(id); });
}

function worstKind(factors) {
  return factors.reduce(function (worst, factor) {
    return RANK[factor.kind] > RANK[worst] ? factor.kind : worst;
  }, "published");
}

function totals(on, year) {
  const out = { annualOpen: 0, annualShut: 0, programOpen: 0, programShut: 0, rows: [] };
  LINES.forEach(function (line) {
    if (!line.counted) return;
    line.slices.forEach(function (slice) {
      const usd = sliceDollars(slice, year);
      if (usd == null) return;
      const open = isOpen(slice, on);
      if (open) out.annualOpen += usd; else out.annualShut += usd;
      out.rows.push({ line: line.id, slice: slice.id, usd: usd, open: open });
    });
  });
  return out;
}

function gateName(id) {
  const gate = GATES.filter(function (item) { return item.id === id; })[0];
  return gate ? gate.name : id;
}

function moneyEffect(id, on, year) {
  const next = new Set(on);
  if (next.has(id)) next.delete(id); else next.add(id);
  const before = totals(on, year);
  const after = totals(next, year);
  return { annual: after.annualOpen - before.annualOpen };
}

function sliceForGate(id) {
  let found = null;
  LINES.forEach(function (line) {
    line.slices.forEach(function (slice) {
      if (slice.gates.indexOf(id) !== -1) found = slice.id;
    });
  });
  return found;
}

function fmt(n) {
  const value = Math.round(n);
  const sign = value < 0 ? "−" : "";
  const abs = Math.abs(value);
  if (abs >= 1e12) return sign + "$" + (Math.round(abs / 1e10) / 100).toFixed(2) + "T";
  if (abs >= 1e9) return sign + "$" + trimNum((Math.round(abs / 1e7) / 100).toFixed(2)) + "B";
  if (abs >= 1e6) return sign + "$" + trimNum((abs / 1e6).toFixed(abs / 1e6 >= 100 ? 1 : 2)) + "M";
  if (abs === 0) return "$0";
  return sign + "$" + abs.toLocaleString("en-US");
}

function trimNum(text) {
  return text.replace(/(\.\d*?)0+$/, "$1").replace(/\.$/, "");
}

function fmtFactor(factor) {
  if (factor.unit === "usd") return fmt(factor.value);
  if (factor.unit === "share") return trimNum((factor.value * 100).toFixed(1)) + "%";
  if (factor.unit === "count") {
    if (Number.isInteger(factor.value)) return factor.value.toLocaleString("en-US");
    return trimNum(factor.value.toFixed(2));
  }
  return String(factor.value);
}

function equation(factors, slice, year) {
  if (slice && slice.remainder && year) {
    const used = usedByRemainder(slice, year);
    if (!used) return fmt(slice.remainder.pond);
    return fmt(slice.remainder.pond) + " − " + fmt(used) + " = " + fmt(slice.remainder.pond - used);
  }
  if (factors.length === 1) return factors[0].label + " = " + fmtFactor(factors[0]);
  return factors.map(fmtFactor).join(" × ") + " = " + fmt(roundDollars(product(factors)));
}

function yearNote(pack, year) {
  if (!pack) return "";
  if (pack.flat) return "No print for " + year + ". Showing " + pack.asOf + ".";
  if (pack.asOf && pack.asOf !== year) return "Figure is " + pack.asOf + ".";
  return "";
}

function readHash() {
  let raw = "";
  try {
    raw = decodeURIComponent(location.hash.replace(/^#/, ""));
  } catch (err) {
    raw = "";
  }
  let year = 2026;
  const on = new Set();
  raw.split("/").filter(Boolean).forEach(function (part) {
    if (part === "later") year = 2030;
    else if (/^20(2[6-9]|30)$/.test(part)) year = Number(part);
    else if (part === "selftest") return;
    else part.split(".").forEach(function (id) {
      if (GATES.some(function (gate) { return gate.id === id; })) on.add(id);
    });
  });
  return { year: year, on: on };
}

function writeHash(state) {
  const ids = Array.from(state.on).sort();
  const bits = [];
  if (state.year !== 2026) bits.push(String(state.year));
  if (ids.length) bits.push(ids.join("."));
  const target = bits.length ? location.pathname + location.search + "#" + bits.join("/") : location.pathname + location.search;
  if ((location.pathname + location.search + location.hash) !== target) history.replaceState(null, "", target);
}

        });
        if (slice.remainder && slice.remainder.lines.length) {
          body.push(el("p", { class: "note" }, "Minus " + slice.remainder.lines.map(function (id) { return lineById(id).name; }).join(", ") + "."));
        }
        (slice.points || []).forEach(function (point) {
          body.push(el("p", { class: "note" }, el("span", { class: "chip " + point[0] }, point[0]), " ", point[1]));
        });
        body.push(el("p", { class: "src note" }, slice.sources));
      }
      return el("div", { class: "slice-block" }, body);
    });
    dialog.replaceChildren(el("div", { class: "sheet-body" },
      el("div", { class: "sheet-top" },
        el("h3", null, line.name),
        el("button", { type: "button", class: "text-btn", "data-action": "close" }, "Close")
      ),
      blocks,
      el("button", { type: "button", class: "text-btn", "data-action": "close", style: "margin-top:12px" }, "Close")
    ));
  }

  function openSheet(lineId) {
    sheetLine = lineId;
    fillSheet(lineId);
    if (!dialog.open) dialog.showModal();
  }

  function clearMarks() {
    app.querySelectorAll(".ev.on").forEach(function (node) { node.classList.remove("on"); });
    app.querySelectorAll(".chunk.lit, .seg.lit").forEach(function (node) { node.classList.remove("lit"); });
  }

  function markSlice(id) {
    clearMarks();
    const row = app.querySelector('[data-ev="' + id + '"]');
    if (row) row.classList.add("on");
    app.querySelectorAll('[data-slice="' + id + '"]').forEach(function (node) {
      if (node.classList.contains("chunk") || node.classList.contains("seg")) node.classList.add("lit");
    });
  }

  function hidePop() {
    pop.hidden = true;
    pop.classList.remove("pin");
    pop.removeAttribute("data-key");
  }

  function releasePin() {
    pinned = null;
    pinnedNode = null;
  }

  function stillHome(id, next, fromMaster) {
    if (!id || !next || !next.closest) return false;
    if (next.closest("#pop")) return true;
    if (next.closest('[data-ev="' + id + '"]')) return true;
    if (next.closest('[data-slice="' + id + '"]')) return true;
    return !!fromMaster && !!next.closest(".master");
  }

  function showPop(button, force) {
    if (coarse && !force) return;
    if (!button || !button.isConnected) return;
    const line = lineById(button.getAttribute("data-line"));
    const slice = line && line.slices.filter(function (item) { return item.id === button.getAttribute("data-slice"); })[0];
    if (!slice) return;
    const pack = resolve(slice, state.year);
    if (!pack) return;
    const key = slice.id + "|" + state.year + "|" + (isOpen(slice, state.on) ? "1" : "0") + "|" + (button.classList.contains("seg") ? "seg" : (button.closest(".board") ? "board" : "chunk"));
    const reuse = pop.getAttribute("data-key") === key && !pop.hidden;
    if (button.classList.contains("seg")) {
      clearMarks();
      button.classList.add("lit");
    } else {
      markSlice(slice.id);
    }
    if (button.closest(".board")) {
      hidePop();
      return;
    }
    if (reuse) {
      if (pinned) pop.classList.add("pin");
      else pop.classList.remove("pin");
      return;
    }
    const note = yearNote(pack, state.year);
    pop.replaceChildren(el("div", null,
      el("strong", null, line.name + " · " + (isOpen(slice, state.on) ? "open" : "shut")),
      el("p", { class: "eqline" }, equation(pack.factors, slice, state.year)),
      note ? el("p", null, note) : null,
      (slice.points || []).map(function (point) {
        return el("p", null, point[0] + ". " + point[1]);
      }),
      el("p", { class: "src" }, slice.sources)
    ));
    if (pinned) pop.classList.add("pin");
    else pop.classList.remove("pin");
    pop.setAttribute("data-key", key);
    pop.hidden = false;
    if (window.innerWidth <= 700) {
      pop.style.left = "";
      pop.style.top = "";
      return;
    }
    const rect = button.getBoundingClientRect();
    const width = pop.offsetWidth;
    let left = rect.left;
    if (left + width > window.innerWidth - 12) left = window.innerWidth - width - 12;
    pop.style.left = Math.max(12, left) + "px";
    let top = rect.bottom + 8;
    const height = pop.offsetHeight;
    if (top + height > window.innerHeight - 12) top = Math.max(12, rect.top - height - 8);
    pop.style.top = top + "px";
  }

  document.addEventListener("click", function (event) {
    if (event.target.closest("#pop")) return;
    const gate = event.target.closest("[data-gate]");
    if (gate) {
      const id = gate.getAttribute("data-gate");
      if (state.on.has(id)) state.on.delete(id); else state.on.add(id);
      jumpTo = sliceForGate(id);
      releasePin();
      hidePop();
      announce(id);
      render({ id: id, sheet: gate.hasAttribute("data-sheet") || !!event.target.closest("dialog") });
      return;
    }
    const year = event.target.closest("[data-year]");
    if (year) {
      state.year = Number(year.getAttribute("data-year"));
      releasePin();
      hidePop();
      announceYear();
      render();
      return;
    }
    const action = event.target.closest("[data-action]");
    if (action) {
      const name = action.getAttribute("data-action");
      if (name === "today" || name === "all") { releasePin(); hidePop(); }
      if (name === "today") { state.on.clear(); state.year = 2026; }
      if (name === "all") GATES.forEach(function (item) { state.on.add(item.id); });
      if (name === "copy") { copyLink(); return; }
      if (name === "close") { dialog.close(); sheetLine = null; return; }
      render();
      return;
    }
    const jump = event.target.closest("[data-jump]");
    if (jump) {
      const node = document.getElementById("group-" + jump.getAttribute("data-jump"));
      if (node) node.scrollIntoView({ block: "start" });
      return;
    }
    const sliceBtn = event.target.closest("[data-slice]");
    if (sliceBtn) {
      if (sliceBtn.closest(".board") && pinnedNode === sliceBtn) {
        releasePin();
        clearMarks();
        hidePop();
        return;
      }
      pinned = sliceBtn.getAttribute("data-slice");
      pinnedNode = sliceBtn;
      showPop(sliceBtn, true);
      return;
    }
    const lineButton = event.target.closest("[data-line]");
    if (lineButton) { openSheet(lineButton.getAttribute("data-line")); return; }
    if (event.target.closest("[data-ev]")) return;
    releasePin();
    clearMarks();
    hidePop();
  });

  document.addEventListener("pointerover", function (event) {
    const slice = event.target.closest("[data-slice]");
    if (!slice) return;
    if (pinned && pinnedNode && slice !== pinnedNode) return;
    showPop(slice, false);
  });
  document.addEventListener("focusin", function (event) {
    const slice = event.target.closest("[data-slice]");
    if (!slice) return;
    if (pinned && slice !== pinnedNode) {
      pinned = slice.getAttribute("data-slice");
      pinnedNode = slice;
    }
    showPop(slice, true);
  });
  document.addEventListener("pointerout", function (event) {
    const slice = event.target.closest("[data-slice]");
    const ev = event.target.closest("[data-ev]");
    const inPop = event.target.closest("#pop");
    const inMaster = event.target.closest(".master");
    let id = slice ? slice.getAttribute("data-slice") : (ev ? ev.getAttribute("data-ev") : "");
    if (!id && (inPop || inMaster)) {
      const open = app.querySelector(".ev.on");
      id = open ? open.getAttribute("data-ev") : (pinned || "");
    }
    if (!id) return;
    const fromMaster = !!inMaster || !!(ev && ev.closest(".master"));
    if (stillHome(id, event.relatedTarget, fromMaster)) return;
    if (pinned && pinnedNode && pinnedNode.isConnected) return;
    clearMarks();
    hidePop();
  });
  document.addEventListener("focusout", function (event) {
    if (pinned) return;
    const slice = event.target.closest("[data-slice]");
    if (!slice) return;
    if (stillHome(slice.getAttribute("data-slice"), event.relatedTarget, !!slice.closest(".master"))) return;
    clearMarks();
    hidePop();
  });

  function announce(id) {
    const view = totals(state.on, state.year);
    live.textContent = gateName(id) + (state.on.has(id) ? " is open. " : " is shut. ") + fmt(view.annualOpen) + " open.";
  }

  function announceYear() {
    const view = totals(state.on, state.year);
    live.textContent = state.year + ". " + fmt(view.annualOpen) + " open.";
  }

  function copyLink() {
    const text = location.href;
    function showField() {
      const box = app.querySelector(".linkbox");
      live.textContent = "Select the link and copy it.";
      if (box) { box.focus(); box.select(); }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        live.textContent = "Link copied.";
      }, showField);
    } else showField();
  }

  function renderSources() {
    const foot = document.getElementById("sources");
    foot.replaceChildren(
      el("h2", null, "How the sum is built"),
      el("p", null, "The seven printed parts sum to $28.44T. Broadband subtracts the three Quilty Starlink forecasts. Advertising subtracts 2025 X advertising. Gov is not inside a printed part. Lines with no published dollar are named and left out. Overlaps remain: a 2026 forecast is not 2025 revenue, and the filing ponds overlap one another only at the edges the issuer already rounded. Not SpaceX guidance."),
      el("h2", null, "Sources checked " + WHEN),
      el("ul", null,
        item("SpaceX preliminary S-1, 20 May 2026, as quoted by The Wall Street Journal: quantifiable TAM of $28.5 trillion, excluding China and Russia. Space-enabled solutions $370 billion. Starlink broadband $870 billion. Starlink mobile $740 billion. AI infrastructure $2.4 trillion. Consumer subscriptions $760 billion. Digital advertising $600 billion. Enterprise applications $22.7 trillion."),
        item("Quilty Space, Starlink Financial Overview, 20 March 2026: 2026 consumer $11.3 billion, enterprise $1.68 billion, maritime $1.94 billion, Starshield $3.2 billion. Aviation up 68%, with no dollar on that line. Direct to cell: 25 million monthly users, with no price on that line. Advanced Television, 24 March 2026, reports the $20 billion, $11.3 billion, $1.68 billion, and $1.94 billion figures."),
        item("Hollywood Reporter, 26 May 2026, on the filing: 2025 X advertising $1.84 billion. About 6.3 million paid subscribers, of which about 4.4 million are X Premium and Premium+ and about 1.9 million are SuperGrok, SuperGrok Heavy, and SuperGrok Lite. Imagine produced about 10 billion images and over 2 billion videos a month in the first quarter of 2026."),
        item("x.ai/pricing, 9 October 2026: SuperGrok $30 a month, including Grok Bot. SuperGrok Plus $100 a month, with higher usage on Chat, Imagine, Voice, and Build. The API is a separate tab. Lite and Heavy are listed without a public price."),
        item("Investor's Business Daily, 21 May 2026, on the filing: 10.3 million Starlink subscribers on 31 March 2026. ARPU $66 that quarter."),
        item("SpaceX preliminary S-1 risk factors, as quoted by Cape Fear Advisors, 22 May 2026: space uses Novaspace; connectivity uses counts, ARPU, and penetration; AI infrastructure uses third-party compute demand, including RAND, plus internal assumptions. The factors themselves are not printed."),
        item("The Motley Fool, 2 October 2026: the consumer-subscription and advertising ponds are the Grok and X opportunity, and the enterprise print follows the Digital Cooperation Organization's digital-economy estimate. The printed TAM does not include data centers in space or Earth-to-Earth transport."),
        item("Digital Cooperation Organization, 11 December 2025: digital economy projected at about $28 trillion in 2026. The S-1 prints $22.70 trillion."),
        item("Filing coverage of 2025 results: revenue about $18.7 billion, connectivity about $11.4 billion."),
        item("Starship flight 14, 28 September 2026: reached orbit, 26 Starlink V3 satellites deployed. No price published.")
      )
    );
  }

  function item(text) { return el("li", null, text); }

  dialog.addEventListener("close", function () { sheetLine = null; });
  render();
}

function audit() {
  function assert(cond, msg) {
    if (!cond) throw new Error(msg);
  }
  const none = totals(new Set(), 2026);
  const all = totals(new Set(GATES.map(function (gate) { return gate.id; })), 2026);
  const evidenced = ["residential", "enterprise", "maritime", "gov", "ads"].reduce(function (sum, id) {
    return sum + lineById(id).slices.reduce(function (inner, slice) { return inner + sliceDollars(slice, 2026); }, 0);
  }, 0);
  assert(Math.round(none.annualOpen) === Math.round(evidenced), "open is the sourced lines");
  assert(Math.round(none.annualShut) === Math.round(PONDS - (evidenced - sliceDollars(lineById("gov").slices[0], 2026))), "shut is the print minus lines inside it");
  assert(Math.round(none.annualOpen + none.annualShut) === Math.round(all.annualOpen + all.annualShut), "gate toggle leaked dollars");
  assert(fmt(PONDS) === "$28.44T", "printed parts");
  assert(fmt(none.annualOpen + none.annualShut) === "$28.44T", "displayed sum");
  assert(fmt(none.annualOpen) === "$19.96B", "open display");
  assert(fmt(none.annualShut) === "$28.42T", "shut display");
  assert(fmt(2.4e12) === "$2.40T", "infrastructure trillions");
  assert(fmt(22.7e12) === "$22.70T", "enterprise trillions");
  assert(fmt(1015000000) === "$1.02B", "billion half-up");
  GATES.forEach(function (gate) {
    const usd = sliceDollars(lineById(gate.id).slices[0], 2026);
    assert(moneyEffect(gate.id, new Set(), 2026).annual === usd, gate.id + " effect");
    assert(sliceForGate(gate.id) === gate.id + "-rest", gate.id + " segment");
  });
  assert(sliceDollars(lineById("s1-bb").slices[0], 2026) === Math.round(870e9 - 11.3e9 - 1.68e9 - 1.94e9), "broadband remainder");
  assert(sliceDollars(lineById("s1-ads").slices[0], 2026) === Math.round(600e9 - 1.84e9), "ads remainder");
  assert(sliceDollars(lineById("s1-space").slices[0], 2026) === 370e9, "space is the full print");
  [2027, 2028, 2029, 2030].forEach(function (year) {
    assert(totals(new Set(), year).annualOpen === none.annualOpen, "year " + year + " invented dollars");
    const home = resolve(lineById("residential").slices[0], year);
    assert(home.flat === true && home.asOf === 2026, "residential hold " + year);
    const ads = resolve(lineById("ads").slices[0], year);
    assert(ads.flat === true && ads.asOf === 2025, "ads hold " + year);
    const space = resolve(lineById("s1-space").slices[0], year);
    assert(space.flat === true && space.asOf === 2026, "space hold " + year);
  });
  assert(resolve(lineById("ads").slices[0], 2026).flat === false, "ads 2026 is not a later hold");
  assert(yearNote(resolve(lineById("ads").slices[0], 2026), 2026) === "Figure is 2025.", "ads year note");
  assert(fmt(GROK_CHECK) === "$684M", "grok check");
  assert(Math.round(GROK_CHECK) === Math.round(1.9e6 * 30 * 12), "grok product");
  assert(fmt(STARLINK_CHECK) === "$8.16B", "starlink now");
  const bbPoints = lineById("s1-bb").slices[0].points;
  const publishedNow = bbPoints.filter(function (point) { return point[0] === "published" && point[1].indexOf("10.3 million") !== -1; })[0];
  const derivedNow = bbPoints.filter(function (point) { return point[0] === "derived" && point[1].indexOf(fmt(STARLINK_CHECK)) !== -1; })[0];
  assert(!!publishedNow && publishedNow[1].indexOf("×") === -1, "subscriber count stays published");
  assert(!!derivedNow && derivedNow[1].indexOf("× $66 × 12") !== -1, "annualization stays derived");
  assert(!LINES.some(function (line) { return line.id === "chat" || line.id === "bot" || line.id === "build" || line.id === "api"; }), "grok stayed out of the sum");
  const blob = JSON.stringify({ lines: LINES, gates: GATES, groups: GROUPS, unpriced: UNPRICED, grok: GROK });
  assert(!/civilian|nasa|dragon|hls|itar/i.test(blob), "banned content");
  assert(!LINES.some(function (line) { return line.id === "terafab" || line.id === "starship" || line.id === "hls"; }), "unpriced line entered the sum");
  LINES.forEach(function (line) {
    line.slices.forEach(function (slice) {
      [2026, 2027, 2028, 2029, 2030].forEach(function (year) {
        const usd = sliceDollars(slice, year);
        assert(usd != null && isFinite(usd) && usd > 0, line.id + " " + year);
      });
    });
  });
  return {
    open: fmt(none.annualOpen),
    shut: fmt(none.annualShut),
    sum: fmt(none.annualOpen + none.annualShut),
    broadband: fmt(sliceDollars(lineById("s1-bb").slices[0], 2026)),
    gov: fmt(sliceDollars(lineById("gov").slices[0], 2026))
  };
}

function el(tag, attrs) {
  const node = document.createElement(tag);
  const kids = Array.prototype.slice.call(arguments, 2).flat();
  if (attrs) {
    Object.keys(attrs).forEach(function (key) {
      const value = attrs[key];
      if (value == null || value === false) return;
      if (key === "class") node.className = value;
      else node.setAttribute(key, String(value));
    });
  }
  kids.forEach(function (kid) {
    if (kid == null || kid === false) return;
    node.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  });
  return node;
}

if (typeof document !== "undefined") boot();
else print(JSON.stringify(audit()));
</script>
