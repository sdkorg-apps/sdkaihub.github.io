<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="The SpaceX TAM breakdown is $10. The tile lists the business units and the total.">
<title>SpaceX TAM breakdown — SDK AI Hub</title>
<link rel="icon" href="/assets/sdkaihub_mark.png" type="image/png">
<style>
  :root {
    --ink: #1c1914;
    --muted: #5e574c;
    --line: #e3d8c4;
    --paper: #f4efe4;
    --card: #fffdf8;
    --copper: #8a4e1c;
    --shadow: 0 16px 40px rgba(60, 40, 10, 0.08);
    --serif: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    color: var(--ink);
    background:
      radial-gradient(1200px 500px at 10% -10%, rgba(138, 78, 28, 0.08), transparent 50%),
      var(--paper);
    font-family: var(--sans);
    line-height: 1.45;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0 auto 0 0;
    width: 8px;
    background: #1c1914;
  }
  a { color: var(--copper); }
  .wrap { width: min(680px, calc(100vw - 40px)); margin: 0 auto; }
  header.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px 16px;
    padding: 22px 0 8px;
  }
  .brand { display: flex; align-items: center; gap: 8px; color: var(--ink); text-decoration: none; font-weight: 700; }
  .brand img { width: 22px; height: 22px; }
  a.donate {
    display: inline-block;
    background: var(--card);
    color: var(--ink);
    border: 2px solid var(--ink);
    text-decoration: none;
    border-radius: 999px;
    padding: 8px 14px;
    font-weight: 700;
    font-size: 0.9rem;
  }
  a.donate:hover { background: var(--ink); color: var(--paper); }
  .kicker {
    margin: 28px 0 8px;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--copper);
  }
  h1 {
    margin: 0;
    font-family: var(--serif);
    font-size: clamp(2.8rem, 7vw, 4.4rem);
    font-weight: 600;
    letter-spacing: -0.04em;
    line-height: 0.95;
  }
  .lede { max-width: 46ch; color: var(--muted); font-size: 1.08rem; }
  a.pay {
    display: inline-block;
    margin: 8px 0 28px;
    background: var(--ink);
    color: var(--paper);
    text-decoration: none;
    border-radius: 999px;
    padding: 12px 16px;
    font-weight: 700;
  }
  a.pay:hover { background: var(--copper); color: var(--paper); }
  :focus-visible { outline: 2px solid var(--copper); outline-offset: 2px; }
  @media (max-width: 700px) {
    body::before { width: 0; }
    header.top { display: block; }
    header.top .donate { margin-top: 12px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="/tam/"><img src="/assets/sdkaihub_mark.png" alt="">TAM</a>
    <a class="donate" href="https://x.com/messages/compose?recipient_id=2426099365&amp;text=Donation%20for%20the%20TAM%20boards" target="_blank" rel="noopener">Donate to @GenAIBiz</a>
  </header>
  <main>
    <p class="kicker">SpaceX</p>
    <h1>Breakdown</h1>
    <p class="lede">The tile lists the business units and the total. The evidence behind them is $10. Payment opens in this browser, and the breakdown opens after Stripe confirms it.</p>
    <a class="pay" href="https://buy.stripe.com/9B68wRdxBdbRcty6ET5J602">See the breakdown · $10</a>
  </main>
</div>
</body>
</html>
